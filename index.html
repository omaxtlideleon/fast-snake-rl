<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #444;
        }

        #game-board {
            position: relative;
            background: #222;
            border: 2px solid #555;
            margin-bottom: 20px;
        }
        #ai-board {
            position: relative;
            background: #222;
            border: 2px solid #555;
            margin-bottom: 20px;
        }

        .snake {
            position: absolute;
            width: 20px;
            height: 20px;
            background: lime;
        }

        .food {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
        }

        .wall {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #888;
        }

        #reward-chart {
            border: 1px solid #555;
            background: #222;
        }
    </style>
</head>

<body>
    <h1>Snake RL</h1>
    <div id="controls">
        <button id="start-button">Manual Play</button>
        <button id="walls-button">Toggle Walls</button>
        <button id="train-button">Train Agent</button>
        <button id="play-policy-button">Play Policy</button>
    </div>
    <div class="boards-container" style="display: flex; gap: 20px; align-items: center;">
        <div>
            <h3>Actual</h3>
            <div id="game-board" style="position: relative; border: 2px solid #333; background: #111;"></div>
        </div>
        <div>
            <h3>AI View</h3>
            <div id="ai-board" style="position: relative; border: 2px solid #555; background: #000;"></div>
        </div>
    </div>
    <h2>Training Reward Graph</h2>
    <canvas id="reward-chart" width="600" height="200"></canvas>
    <div id="training-stats" style="color:white; font-family: monospace; margin-top:10px;">
    <div>(Total) Games: <span id="games-trained"></span></div>
    <div>Games here: <span id="games-count">0</span></div>
    <div>Games/sec: <span id="games-sec">0</span></div>
    <div>Highest reward: <span id="highest-reward">0</span></div>
    <div>Average reward: <span id="avg-reward">0</span></div>
    <div>Highest score: <span id="highest-score">0</span></div>
    <div>Average score: <span id="avg-score">0</span></div>
    <div>Highest steps: <span id="highest-steps">0</span></div>
    <div>Epsilon: <span id="epsilon-val">1.0</span></div>
</div>

    <script src="script.js"></script>
</body>
</html>
